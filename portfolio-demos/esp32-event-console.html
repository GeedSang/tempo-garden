<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动眼镜事件控制台</title><style>:root{--bg:#071216;--panel:#102329;--line:#28444a;--text:#eef8f5;--muted:#a8c3bf;--mint:#8ce5d4;--orange:#ffad5c;--red:#ff6f61}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#183b3e,#071216 54%);color:var(--text);font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{width:min(1180px,92vw);margin:auto;padding:42px 0 70px}.eyebrow{color:var(--mint);letter-spacing:.16em;font-size:12px;font-weight:800}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(38px,7vw,72px);line-height:1;margin:42px 0 14px;letter-spacing:-.05em}.lead{color:var(--muted);font-size:19px;max-width:760px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:38px}.panel{background:#102329dd;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0004}.panel h2{font-size:20px;margin:0 0 18px}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.event{border:1px solid var(--line);background:#0b1a1f;color:var(--text);border-radius:16px;padding:18px;text-align:left;cursor:pointer;transition:.2s}.event:hover{border-color:var(--mint);transform:translateY(-2px);background:#153238}.event strong{display:block;font-size:18px}.event small{color:var(--muted)}.device{min-height:370px;display:grid;place-items:center}.screen{width:min(330px,80%);aspect-ratio:1.28;background:#061114;border:2px solid #496e70;border-radius:28px;padding:22px;box-shadow:0 0 48px #4edac233}.screen-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.signal{height:150px;display:grid;place-items:center;text-align:center;font-size:48px;color:var(--mint);font-weight:800}.signal span{display:block;font-size:15px;color:var(--muted);font-weight:400}.led{width:12px;height:12px;border-radius:50%;background:var(--mint);box-shadow:0 0 22px var(--mint);margin:14px auto}.vibrate{animation:shake .25s linear infinite}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.log{margin:18px 0 0;padding:12px;border-left:2px solid var(--mint);color:var(--muted);font-size:14px;min-height:42px}.row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:13px 0;color:var(--muted)}.row b{color:var(--text)}.hint{color:var(--orange);font-size:13px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--mint);color:#09201f;font-weight:800;cursor:pointer}.btn.alt{background:#1d3a3e;color:var(--text)}@media(max-width:800px){.grid{grid-template-columns:1fr}.events{grid-template-columns:1fr}}</style><main><div class="top"><span class="eyebrow">SPORT GLASSES / ESP32 PROTOTYPE</span><button class="btn alt" id="clear">清空记录</button></div><h1>运动事件控制台</h1><p class="lead">用手机网页发送事件，模拟 ESP32 如何选择 OLED、灯光和震动反馈。先验证信息策略，再决定最终眼镜功能。</p><section class="grid"><div class="panel"><h2>手机端 发送事件</h2><div class="events" id="events"></div><p class="hint">当前是浏览器模拟模式。后续可将 sendEvent 替换为 BLE 或 Web Bluetooth 通信。</p><div class="log" id="log">等待发送事件</div></div><div class="panel"><h2>ESP32 端 反馈预览</h2><div class="device" id="device"><div class="screen"><div class="screen-top"><span>ESP32 NODE</span><span>● 已连接</span></div><div class="signal" id="signal">—<span>等待事件</span></div><div class="led" id="led"></div></div></div><div class="row"><span>反馈方式</span><b id="feedback">无</b></div><div class="row"><span>事件级别</span><b id="level">待机</b></div></div></section><script>const data={normal:{name:'普通提示',level:'普通',icon:'→',feedback:'OLED 显示',color:'#8ce5d4'},important:{name:'重要提示',level:'重要',icon:'↗',feedback:'OLED 加闪灯',color:'#ffad5c'},urgent:{name:'紧急提示',level:'紧急',icon:'!',feedback:'震动加红灯',color:'#ff6f61'},connected:{name:'连接成功',level:'系统',icon:'✓',feedback:'OLED 显示',color:'#8ce5d4'},confirm:{name:'信息确认',level:'确认',icon:'OK',feedback:'停止重复提醒',color:'#b6a7ff'}};const events=document.querySelector('#events'),signal=document.querySelector('#signal'),led=document.querySelector('#led'),device=document.querySelector('#device'),log=document.querySelector('#log'),feedback=document.querySelector('#feedback'),level=document.querySelector('#level');let history=[];Object.entries(data).forEach(([key,e])=>{const b=document.createElement('button');b.className='event';b.innerHTML='<strong>'+e.name+'</strong><small>'+e.feedback+'</small>';b.onclick=()=>sendEvent(key);events.appendChild(b)});function sendEvent(key){const e=data[key];signal.innerHTML=e.icon+'<span>'+e.name+'</span>';feedback.textContent=e.feedback;level.textContent=e.level;device.classList.toggle('vibrate',key==='urgent');led.style.background=e.color;led.style.boxShadow='0 0 22px '+e.color;log.textContent=new Date().toLocaleTimeString()+'  ESP32 已处理：'+e.name+' → '+e.feedback;history.unshift({key,time:Date.now()});localStorage.setItem('esp32EventHistory',JSON.stringify(history.slice(0,20)))}document.querySelector('#clear').onclick=()=>{history=[];localStorage.removeItem('esp32EventHistory');log.textContent='记录已清空'};history=JSON.parse(localStorage.getItem('esp32EventHistory')||'[]');</script></main></html>
