<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo Garden · 动态花园</title><style>:root{--a:#f2aa67;--m:#cbb9a7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#53301e,#17110f 55%);color:#f8efe4;font:16px/1.6 system-ui,"Microsoft YaHei"}main{width:min(1180px,92vw);margin:auto;padding:48px 0 72px}.top{display:flex;justify-content:space-between}.eyebrow{color:var(--a);letter-spacing:.2em;font-size:12px;font-weight:700}.pill{border:1px solid #ffffff25;border-radius:99px;padding:7px 13px;color:var(--m);font-size:12px}h1{font:800 clamp(44px,8vw,94px)/.9 Georgia;margin:42px 0 18px}.lead{color:var(--m);font-size:19px;max-width:680px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:48px}.card{border:1px solid #ffffff1d;border-radius:28px;background:#241914cc;box-shadow:0 22px 70px #0004;padding:24px}.stage{min-height:430px;position:relative;background:radial-gradient(circle at 50% 45%,#49301f,#211612 62%);overflow:hidden}.stage:before{content:"";position:absolute;inset:16% 10%;border:1px solid #f2aa6738;border-radius:50%}.seed{position:absolute;width:38px;height:38px;border-radius:50%;left:50%;top:30%;background:var(--plant,#ffd6a3);box-shadow:0 0 34px #f2aa67;transform:translate(-50%,-50%) scale(.5);transition:all .5s}.kettle{position:absolute;left:18%;top:24%;width:92px;height:58px;background:#d78952;border-radius:18px 18px 26px 26px;transform:rotate(12deg);box-shadow:0 10px 20px #0005;transition:all .25s}.kettle:before{content:"";position:absolute;right:-42px;top:12px;width:52px;height:18px;border-top:8px solid #d78952;transform:rotate(-18deg)}.kettle:after{content:"";position:absolute;left:20px;top:-20px;width:50px;height:28px;border:6px solid #d78952;border-bottom:0;border-radius:40px 40px 0 0}.water{position:absolute;left:calc(18% + 82px);top:58%;width:5px;height:0;background:#8fd3ff;box-shadow:0 0 10px #8fd3ff;transition:height .25s}.pot{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:150px;height:90px;background:linear-gradient(145deg,#b75f3d,#713323);clip-path:polygon(8% 0,92% 0,78% 100%,22% 100%);border-radius:8px;box-shadow:0 16px 28px #0005}.stem{position:absolute;left:50%;bottom:145px;width:12px;height:150px;background:var(--plant,#6f9b55);transform:translateX(-50%) scaleY(.25);transform-origin:bottom;border-radius:10px;transition:transform .5s}.leaf{position:absolute;width:58px;height:28px;background:#87b86a;border-radius:100% 0 100% 0;opacity:.2;transition:all .5s}.leaf.l1{left:calc(50% - 62px);bottom:205px;transform:rotate(-25deg)}.leaf.l2{left:calc(50% + 5px);bottom:245px;transform:rotate(25deg)}.catalog{position:absolute;right:24px;bottom:22px;color:#f2aa67;font-size:14px}.catalog{position:absolute;right:24px;bottom:22px;color:#f2aa67;font-size:14px}.collection{display:none;position:absolute;inset:24px;background:#241914f2;border:1px solid #f2aa6755;border-radius:18px;padding:22px;z-index:5}.collection.open{display:block}.collection-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;color:#f2aa67}.stage h2{position:absolute;left:24px;bottom:20px;margin:0;color:#f5d7b8}.control{display:flex;flex-direction:column;gap:16px}.preview{width:100%;aspect-ratio:16/10;background:#100d0c;border-radius:18px;object-fit:cover}.btns{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--a);color:#24150c;font-weight:800;cursor:pointer}.btn.alt{background:#4a3024;color:#f3c99f}.status{color:var(--a);font-weight:700;font-size:20px}.note{color:var(--m);font-size:13px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style><main><div class="top"><span class="eyebrow">TEMPO GARDEN / LIVE STUDY</span></div><h1>识别浇水动作</h1><p class="lead">摄像头识别浇水动作并让花朵慢慢生长</p><section class="layout"><div class="card stage"><div id="kettle" class="kettle"></div><div id="water" class="water"></div><div class="pot"></div><div id="stem" class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div id="seed" class="seed"></div><h2 id="state">等待开始浇水</h2><div id="catalog" class="catalog">图鉴等待解锁</div><div id="collection" class="collection"><h3>植物图鉴</h3><div id="collectionList" class="collection-list"></div><button id="closeCatalog" class="btn alt">关闭图鉴</button></div></div><div class="card control"><video id="cam" class="preview" autoplay muted playsinline></video><div class="btns"><button id="go" class="btn">开启摄像头并持续识别</button><button id="reset" class="btn alt">更换植物</button><button id="openCatalog" class="btn alt">查看图鉴</button></div><div class="status" id="msg">准备开始</div><p class="note">摄像头画面只在本地浏览器分析，不会上传。</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const v=cam,s=seed,stem=document.getElementById("stem"),leaves=document.querySelectorAll(".leaf"),kettle=document.getElementById("kettle"),water=document.getElementById("water");let running=false,growth=0;const plants=[{name:"向日葵",color:"#ffd166"},{name:"蓝风铃",color:"#9ac7ff"},{name:"番茄苗",color:"#ff8066"},{name:"薄荷",color:"#9ee493"}];const unlocked=JSON.parse(localStorage.getItem("tempoPlants")||"[]");function renderCatalog(){collectionList.innerHTML=plants.map(p=>`<div>${unlocked.includes(p.name)?"已解锁":"未解锁"} ${p.name}</div>`).join("")}let plant;function choosePlant(){plant=plants[Math.floor(Math.random()*plants.length)];document.documentElement.style.setProperty("--plant",plant.color);growth=0;state.textContent="等待开始浇水";catalog.textContent="本次植物："+plant.name+" 尚未解锁"}choosePlant();renderCatalog();openCatalog.onclick=()=>collection.classList.add("open");closeCatalog.onclick=()=>collection.classList.remove("open");reset.onclick=choosePlant;document.documentElement.style.setProperty("--plant",plant.color);catalog.textContent="本次植物："+plant.name+"  尚未解锁";function paint(watering,xp,yp){kettle.style.left=(12+xp*55)+"%";kettle.style.top=(15+yp*35)+"%";kettle.style.transform=`rotate(${watering?35:12}deg)`;water.style.left=(18+xp*55)+"%";water.style.top=(38+yp*35)+"%";water.style.height=watering?"115px":"0";if(watering){growth=Math.min(100,growth+0.8);water.style.opacity="1"}else water.style.opacity=".25";s.style.transform=`translate(-50%,-50%) scale(${.5+growth/70})`;stem.style.transform=`translateX(-50%) scaleY(${.25+growth/120})`;leaves.forEach(l=>l.style.opacity=Math.min(1,.2+growth/80));if(growth>=100){state.textContent="植物已经长大";catalog.textContent="已解锁图鉴  "+plant.name;if(!unlocked.includes(plant.name)){unlocked.push(plant.name);localStorage.setItem("tempoPlants",JSON.stringify(unlocked));renderCatalog()}}else state.textContent=watering?"正在浇水 花朵生长中":(growth>5?"花朵保持当前状态":"请用手控制浇水壶")}const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});hands.onResults(r=>{if(!r.multiHandLandmarks?.length){state.textContent="未识别到手 请进入镜头";return}const p=r.multiHandLandmarks[0];const wrist=p[0],index=p[8],xp=1-wrist.x,yp=wrist.y;const tilt=index.y-wrist.y;paint(tilt<-.08,xp,yp)});go.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error("当前浏览器不支持摄像头");const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=stream;await v.play();running=true;msg.textContent="摄像头连接成功 请用手控制浇水壶";const send=async()=>{if(running&&v.readyState>=2){await hands.send({image:v})}if(running)requestAnimationFrame(send)};send()}catch(e){msg.textContent=e.name==="NotAllowedError"?"摄像头权限被拒绝 请在浏览器设置中允许":e.name==="NotFoundError"?"没有找到可用摄像头":"摄像头启动失败 请检查权限和设备"}};</script></html>
